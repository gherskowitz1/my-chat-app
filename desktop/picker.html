<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Share Your Screen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #2b2d31;
    color: #f2f3f5;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    user-select: none;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 14px 18px 8px;
    flex-shrink: 0;
  }
  h1 { font-size: 15px; font-weight: 700; }
  p.hint { color: #949ba4; font-size: 12px; margin-top: 4px; }

  main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 18px 12px;
  }

  h2.section {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: #949ba4;
    margin: 14px 0 8px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }

  .source {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    background: #232428;
  }
  .source:hover { background: #35373c; }
  .source.selected { border-color: #5865f2; background: #35373c; }

  .thumb {
    width: 100%;
    height: 80px;
    background: #1e1f22;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .label {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
  }
  .label img.app-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .label span {
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty {
    color: #949ba4;
    padding: 24px 0;
    text-align: center;
  }

  footer {
    flex-shrink: 0;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid #1e1f22;
  }

  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-cancel { background: transparent; color: #f2f3f5; }
  .btn-cancel:hover { text-decoration: underline; }
  .btn-share { background: #5865f2; color: white; }
  .btn-share:hover:not(:disabled) { background: #4752c4; }
  .btn-share:disabled { background: #404249; color: #80848e; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>Share Your Screen</h1>
    <p class="hint">Pick a screen or a window — including any game you have open — to share with the voice channel.</p>
  </header>
  <main id="main">
    <div class="empty">Loading sources…</div>
  </main>
  <footer>
    <button class="btn-cancel" id="cancelBtn">Cancel</button>
    <button class="btn-share" id="shareBtn" disabled>Share</button>
  </footer>

  <script>
    let selectedId = null;

    function renderGroup(title, sources) {
      if (!sources.length) return '';
      const cards = sources.map((s) => `
        <div class="source" data-id="${s.id}">
          <div class="thumb">${s.thumbnail ? `<img src="${s.thumbnail}" />` : ''}</div>
          <div class="label">
            ${s.appIcon ? `<img class="app-icon" src="${s.appIcon}" />` : ''}
            <span title="${s.name}">${s.name}</span>
          </div>
        </div>
      `).join('');
      return `<h2 class="section">${title}</h2><div class="grid">${cards}</div>`;
    }

    async function load() {
      const sources = await window.picker.getSources();
      const screens = sources.filter((s) => s.id.startsWith('screen:'));
      const windows = sources.filter((s) => s.id.startsWith('window:'));
      const main = document.getElementById('main');

      if (!sources.length) {
        main.innerHTML = '<div class="empty">No shareable screens or windows were found.</div>';
        return;
      }

      main.innerHTML = renderGroup('Screens', screens) + renderGroup('Windows &amp; Games', windows);

      main.querySelectorAll('.source').forEach((el) => {
        el.addEventListener('click', () => {
          main.querySelectorAll('.source.selected').forEach((s) => s.classList.remove('selected'));
          el.classList.add('selected');
          selectedId = el.dataset.id;
          document.getElementById('shareBtn').disabled = false;
        });
        el.addEventListener('dblclick', () => {
          selectedId = el.dataset.id;
          window.picker.select(selectedId);
        });
      });
    }

    document.getElementById('shareBtn').addEventListener('click', () => {
      if (selectedId) window.picker.select(selectedId);
    });
    document.getElementById('cancelBtn').addEventListener('click', () => window.picker.cancel());
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.picker.cancel();
    });

    load();
  </script>
</body>
</html>
